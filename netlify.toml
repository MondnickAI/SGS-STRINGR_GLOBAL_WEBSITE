# Netlify build settings (docs/DECISIONS.md, ADR-002).
# Netlify detects Next.js and applies its Next.js runtime automatically; no plugin needs installing.
# Secrets (SMTP_*) and NEXT_PUBLIC_SITE_URL are set in the Netlify dashboard, never here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Node 20 reached end of life in April 2026; 22 is the supported LTS line.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
